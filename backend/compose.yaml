name: yarizan-v2-local
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yarizan
      POSTGRES_PASSWORD: local-disposable
      POSTGRES_DB: yarizan
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yarizan -d yarizan"]
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 256m
  api:
    build: .
    profiles: ["api", "web"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://yarizan:local-disposable@db:5432/yarizan
      BROWSER_ORIGIN: ${BROWSER_ORIGIN:-http://localhost:3200}
      CODE_HMAC_KEY: ${CODE_HMAC_KEY:?Set synthetic CODE_HMAC_KEY}
      TOKEN_HMAC_KEY: ${TOKEN_HMAC_KEY:?Set synthetic TOKEN_HMAC_KEY}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Set synthetic MFA_ENCRYPTION_KEY}
    ports: ["127.0.0.1:3100:3100"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 512m
    volumes: ["development-keys:/app/.local"]
  web:
    profiles: ["web"]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 3200
      NUXT_API_BASE: http://api:3100/api/v2/
      NUXT_WEB_ORIGIN: http://localhost:3200
    ports: ["127.0.0.1:3200:3200"]
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 384m
volumes:
  db:
  development-keys:
