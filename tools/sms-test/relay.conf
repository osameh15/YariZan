# TLS passthrough relay for the isolated SMS test: forwards raw TCP to ONE host and nothing else. It
# never terminates TLS (certificate and hostname verification stay in the harness), cannot read the
# token or any message, and writes no access log.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 32; }
stream {
  access_log off;
  resolver 127.0.0.11 valid=30s ipv6=off;
  server {
    listen 443;
    set $vendor console.melipayamak.com;
    proxy_pass $vendor:443;
    proxy_connect_timeout 5s;
    proxy_timeout 20s;
    proxy_socket_keepalive off;
  }
}
