name: V2 Backend CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: yarizan
          POSTGRES_PASSWORD: local-disposable
          POSTGRES_DB: yarizan_phase2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yarizan -d yarizan_phase2_test"
          --health-interval 2s --health-timeout 2s --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://yarizan:local-disposable@127.0.0.1:5432/yarizan_phase2_test
      CODE_HMAC_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
      TOKEN_HMAC_KEY: '2222222222222222222222222222222222222222222222222222222222222222'
      MFA_ENCRYPTION_KEY: '3333333333333333333333333333333333333333333333333333333333333333'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '9.0.x'
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: node tools/check-schema.mjs
      - run: npm run check:contracts
      - run: npx --yes @redocly/cli@2.63.0 lint ../docs/YARIZAN-OPENAPI-BACKEND-V2.json
      - run: npm run check:secrets
      - run: npm audit --audit-level=high
      - run: python ../tools/Check-PublicRepository.py
      - name: Release tooling unit tests (manifest validation)
        working-directory: .
        run: node --test tools/release/manifest.test.mjs
