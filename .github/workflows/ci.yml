name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  legacy:
    name: Legacy .NET Framework compatibility (current Windows runner)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Legacy x64/x86 crypto, licensing and WPF checks
        shell: powershell
        run: .\tests\Run-LegacyChecks.ps1
      - name: Stable legacy release and experimental-mode guards
        shell: powershell
        run: |
          $output = dotnet build src/YariZan.App -c Release -p:LegacyWindows=true -p:CommercialRelease=true -p:IncludeGameBundle=false -p:IncludeGameKey=false 2>&1
          $output | Write-Output
          if ($LASTEXITCODE -eq 0) { throw 'Unaccepted legacy commercial release was allowed.' }
          if (($output -join "`n") -notmatch 'Legacy Windows has not passed') { throw 'Build failed for a reason other than the legacy release guard.' }
          $output = dotnet build src/YariZan.App -c Release -p:LegacyWindows=true -p:LegacyExperimental=true -p:FixtureOnlyBuild=true -p:IncludeGameBundle=false -p:IncludeGameKey=false 2>&1
          if ($LASTEXITCODE -eq 0 -or ($output -join "`n") -notmatch 'LegacyExperimental cannot be combined') { throw 'Experimental fixture build was not refused correctly.' }
          exit 0
  build:
    name: Build (Windows / .NET 9)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore src/YariZan.sln

      - name: Reject tracked private hosting files
        run: python tools/Check-PublicRepository.py

      # The launcher embeds secrets/public.pem and secrets/master.key. private.pem and
      # master.key are gitignored; only public.pem is committed. SerialGen init bails if
      # ANY of the three exists, so on CI we wipe the whole secrets folder first to
      # guarantee a fresh keypair every run. The keys live only in the runner sandbox.
      - name: Generate ephemeral keys
        shell: pwsh
        run: |
          if (Test-Path secrets) { Remove-Item secrets -Recurse -Force }
          dotnet run --project src/YariZan.SerialGen --no-restore -- init

      - name: Isolated grade detection and packaging checks
        shell: powershell
        run: .\tests\Run-GradeChecks.ps1

      - name: Build (Release)
        run: dotnet build src/YariZan.sln --configuration Release --no-restore

      - name: Isolated access and trial grant checks
        shell: powershell
        run: .\tests\Run-AccessChecks.ps1

      - name: Isolated asynchronous game launcher checks
        shell: powershell
        run: .\tests\Run-LauncherChecks.ps1

      - name: Independent synthetic book and navigation checks
        shell: powershell
        run: .\tests\Run-BookChecks.ps1

      - name: Setup Node for V2 signature interoperability
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: V2 device, offline licensing, trial and WPF checks
        shell: powershell
        run: .\tests\Run-V2Checks.ps1

      - name: Lint V2 design API
        run: npx --yes @redocly/cli@2.63.0 lint docs/YARIZAN-OPENAPI-V2.yaml

      # Future: when tests exist, add:
      # - name: Test
      #   run: dotnet test src/YariZan.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Smoke-verify the launcher binary exists
        shell: pwsh
        run: |
          $exe = "src/YariZan.App/bin/Release/net9.0-windows/YariZan.exe"
          if (-not (Test-Path $exe)) { throw "Build did not produce $exe" }
          Write-Host "OK: $exe ($([Math]::Round((Get-Item $exe).Length / 1KB)) KB)"
