name: V2 Web and Provisioning CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: yarizan
          POSTGRES_PASSWORD: local-disposable
          POSTGRES_DB: yarizan_phase2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yarizan -d yarizan_phase2_test"
          --health-interval 2s --health-timeout 2s --health-retries 30
    defaults:
      run:
        working-directory: apps/web
    env:
      DATABASE_URL: postgresql://yarizan:local-disposable@127.0.0.1:5432/yarizan_phase2_test
      CODE_HMAC_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
      TOKEN_HMAC_KEY: '2222222222222222222222222222222222222222222222222222222222222222'
      MFA_ENCRYPTION_KEY: '3333333333333333333333333333333333333333333333333333333333333333'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            backend/package-lock.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '9.0.x'
      - run: npm ci --prefix ../../backend
      - run: npm run build --prefix ../../backend
      - run: npm ci --ignore-scripts
      - run: npm run contracts:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:copy
      - run: npm run check:production-copy
      - run: npm run check:secrets
      - run: npm test
      - name: Production build with BigInt compatibility gate
        run: |
          mkdir -p .local
          set -o pipefail
          npm run build 2>&1 | tee .local/production-build.log
          if grep -Ei 'Big integer literals.*not available|BigInt.*es2019' .local/production-build.log; then
            echo 'Unsupported BigInt build target'; exit 1
          fi
      - name: Runtime audit and explicit unpatched build-dependency report
        run: npm run audit:dependencies
      - run: npx playwright install --with-deps chromium
      - name: Full application browser suite
        run: npm run test:e2e
      - name: Brochure-only production build (Stage A)
        run: npm run build:brochure
      - name: Brochure fail-closed acceptance without Backend, database or secrets
        run: npm run test:brochure
      - name: Public storefront production build (approved prices, no Backend)
        run: npm run build:storefront
      - name: Storefront fail-closed acceptance without Backend, database or secrets
        run: npm run test:storefront
      - name: Production copy guard over every built profile (full, brochure, storefront)
        run: node tools/check-production-copy.mjs --build
      - name: Save browser screenshots and dependency findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-commerce-browser-evidence
          path: |
            apps/web/.local/screenshots/
            apps/web/playwright-report/
            apps/web/.local/dependency-audit.json
            apps/web/.local/production-build.log
          include-hidden-files: true
          retention-days: 14
